name: Atnaujinti YouTube transkriptus
on:
  schedule:
    - cron: "15 6 * * *"   # kasdien 06:15 UTC (09:15 Vilniaus vasarą, 08:15 žiemą)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install youtube-transcript-api
      - run: python fetch_transcripts.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add transcripts
          git diff --cached --quiet || git commit -m "Atnaujinti transkriptai"
          git push
