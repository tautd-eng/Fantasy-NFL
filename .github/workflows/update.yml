name: Atnaujinti duomenis

on:
  schedule:
    - cron: "45 5 * * *"   # kasdien 05:45 UTC (~08:45 Vilniaus vasarą, ~07:45 žiemą) – prieš naujienų agentą 09:48
    - cron: "50 17 * * *"  # kasdien vakare 17:50 UTC (~19:50 Vilniaus žiemą, ~20:50 vasarą)
    - cron: "0 12 * * 3"   # trečiadienį po waiver apdorojimo
    - cron: "0 15 * * 6"   # šeštadienį prieš sekmadienio rungtynes
    - cron: "0 10 * * 0"   # sekmadienio rytą prieš rungtynes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_data.py
      - name: Išsaugoti pakeitimus
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json agent_input.json
          if ! git diff --cached --quiet; then
            git commit -m "Atnaujinti duomenis"
            git push
          fi
