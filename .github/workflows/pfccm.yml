name: PFCCM agentas

on:
  schedule:
    - cron: "20 4 * * *"   # kasdien ~07:20 Vilniaus laiku
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pfccm/agent.py", "pfccm/value.py", "pfccm/config.json", ".github/workflows/pfccm.yml"]

permissions:
  contents: write

concurrency:
  group: pfccm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      - run: python pfccm/agent.py
      - name: Išsaugoti pakeitimus
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add pfccm/data
          if ! git diff --cached --quiet; then
            git commit -m "PFCCM: atnaujinti duomenis"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
          fi
