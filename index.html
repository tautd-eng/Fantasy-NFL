<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Fantasy assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--s1:#fff;--s2:#f3f5f9;--s3:#e6ebf3;--line:#d3d9e4;--tx:#0b0f19;--mu:#556074;--blue:#0b5bd3;--navy:#0a2a5e;--red:#c8102e;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto}
header{background:#000;color:#fff;padding:22px 20px 18px;border-bottom:4px solid var(--blue)}
header .meta,header .pick{color:#b7c0d0}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.meta{margin:6px 0 0;font-size:.85rem}
.pick{display:flex;flex-direction:column;gap:3px;font-size:.8rem}
select,input[type=search],input[type=number],input[type=password],textarea{font:500 .95rem Inter,sans-serif;color:var(--tx);background:#fff;border:1px solid #9aa5b8;padding:8px 10px;min-height:40px;border-radius:0}
textarea{width:100%;min-height:70px;resize:vertical;font-weight:400}
select:focus,input:focus,textarea:focus,button:focus-visible,.hv:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.banner{background:var(--navy);color:#fff;padding:9px 20px;font-weight:500;font-size:.9rem}
main{padding:18px 20px 56px}

.tabs button{background:none;border:0;padding:11px 16px;font:700 .95rem Inter,sans-serif;color:var(--mu);cursor:pointer;white-space:nowrap}

h3{margin:0 0 4px;font-size:1.2rem;font-weight:700}
.hint{margin:0 0 12px;color:var(--mu);font-size:.85rem;max-width:80ch}
small,.mut{color:var(--mu)}

.tag{display:inline-block;margin-left:6px;padding:0 6px;background:var(--red);color:#fff;font-size:.7rem;font-weight:700}
.act{display:inline-block;padding:1px 8px;font:700 .72rem Inter,sans-serif;border:1px solid var(--mu);color:var(--tx);background:transparent;white-space:nowrap}
.act.hold{border-color:var(--line);color:var(--mu)}
.act.sell{background:var(--red);border-color:var(--red);color:#fff}
.act.add,.act.buy{background:var(--blue);border-color:var(--blue);color:#fff}
.act.trade{border-color:var(--blue);color:var(--blue)}
button.act{cursor:pointer}button.act:hover{background:#000;color:#fff;border-color:#000}
.pl,.card{background:var(--s1);border:1px solid var(--line);margin-bottom:8px;padding:10px 12px}
.pl{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 10rem 5.6rem 5rem;gap:4px 14px;align-items:center}
.pl.bn{background:var(--s2)}
.slot{font-weight:700;font-size:.8rem;background:#000;color:#fff;text-align:center;padding:2px 0}
.who b{font-weight:700}.who small{display:block}
.pj{display:grid;grid-template-columns:1fr 3rem;gap:8px;align-items:center}
.track{height:14px;background:var(--s3);position:relative}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue);transition:width .7s ease-out}
.num{text-align:right;font-weight:700;font-size:1.25rem;line-height:1}
.fp{display:flex;align-items:end;gap:6px;justify-content:flex-end;padding:3px 6px;border:1px dashed var(--line);cursor:help}

.mb{display:flex;align-items:end;gap:2px;height:26px}.mb i{width:6px;background:var(--mu);min-height:2px}

.hv:hover{border-color:var(--blue);border-style:solid}
.spark{display:flex;align-items:end;gap:3px;height:30px}

.ins{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.85rem;border-top:1px dashed var(--line);padding-top:7px;margin-top:4px}
.mx{flex-basis:100%;border-collapse:collapse;width:100%;min-width:0;font-size:.76rem;margin-top:2px}
.mx th,.mx td{padding:2px 8px;border-top:1px solid var(--line);text-align:right;background:none;cursor:default;white-space:nowrap;font-size:.76rem;box-shadow:none}
.mx th{color:var(--mu);font-weight:700;text-align:right}.mx td:first-child,.mx th:first-child{text-align:left;color:var(--mu)}
.mx td.hi{background:#dbe8ff;color:var(--navy)}.mx td.lo{background:#fde0e4;color:var(--red)}.mx td small{margin-left:5px}
.chips{display:flex;gap:3px;margin-left:auto}
.chips span{min-width:36px;text-align:center;font-size:.7rem;font-weight:700;padding:1px 4px;border:1px solid var(--line);background:var(--s2);color:var(--mu)}
.chips .e{background:var(--blue);color:#fff;border-color:var(--blue)}.chips .t{background:var(--red);color:#fff;border-color:var(--red)}.chips .b{background:transparent;border-style:dashed}
.sub{margin:20px 0 8px;font-weight:700;font-size:.9rem;color:var(--mu)}
.card{display:grid;grid-template-columns:1fr auto;gap:3px 14px}

.empty{color:var(--mu)}
.trade{background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--blue);padding:12px 14px;margin-bottom:12px}
.th{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.th h4{margin:0;font-size:1rem}
.bal{margin-left:auto;font-size:.75rem;font-weight:700;padding:1px 8px;background:var(--s3)}
.bal.ok{background:var(--navy);color:#fff}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.sw>div{background:var(--s2);padding:8px 10px}.sw h5{margin:0 0 4px;font-size:.75rem;color:var(--mu);font-weight:700}
.sw p{margin:2px 0;font-size:.88rem}
.hl{background:#dbe8ff;font-weight:700;padding:0 4px}
.gain{font-size:.85rem;margin-top:4px}
.builder,.aibox{background:var(--s2);border:1px solid var(--line);padding:12px 14px;margin:0 0 16px;display:grid;gap:12px}

.aibox h4{margin:0}
.msgs{display:grid;gap:8px;max-height:360px;overflow:auto}
.cm{padding:8px 11px;font-size:.9rem;white-space:pre-wrap}.cm.u{background:var(--s3);justify-self:end;max-width:85%}.cm.a{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue)}
.builder label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mu)}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pc{font:500 .8rem Inter,sans-serif;background:#fff;color:var(--tx);border:1px solid var(--line);padding:4px 9px;cursor:pointer}
.pc[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.pc small{color:inherit;opacity:.7;margin-left:4px}
.btn{font:700 .85rem Inter,sans-serif;background:#000;color:#fff;border:0;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--blue)}.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid #9aa5b8}
.lk,.tog,.clr{font:700 .78rem Inter,sans-serif;background:transparent;border:1px solid var(--blue);color:var(--blue);padding:3px 9px;cursor:pointer}
.lk:hover,.clr:hover{background:var(--blue);color:#fff}
.tog[aria-pressed=true]{background:var(--blue);color:#fff}
.focus{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--navy);padding:8px 12px;margin:0 0 14px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 14px}
.seg{display:flex}.seg button{background:#fff;border:1px solid #9aa5b8;margin-left:-1px;padding:7px 13px;font:700 .85rem Inter,sans-serif;cursor:pointer;color:var(--tx)}
.seg button[aria-pressed=true]{background:#000;border-color:#000;color:#fff}
.count{margin-left:auto;color:var(--mu);font-size:.85rem}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:7px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-size:.88rem}
tbody tr:nth-child(even){background:#f8f9fc}
th{font-weight:700;cursor:pointer;border-top:0;background:#000;color:#fff;user-select:none}
th.l,td.l{text-align:left}th[aria-sort]{box-shadow:inset 0 -3px 0 var(--blue)}
td.pj2{font-weight:700;background:#e4eeff}td.hv{cursor:help}
td.hi{color:var(--blue);font-weight:700}td.lo{color:var(--red);font-weight:700}
.tip{display:none;position:fixed;z-index:50;width:min(360px,calc(100vw - 16px));background:#fff;color:var(--tx);border:2px solid #000;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:10px 12px;font-size:.8rem;line-height:1.4}
.tip h5{margin:0 0 6px;font-size:.8rem}.tip .fr{display:grid;grid-template-columns:2.4rem 4.2rem 2.6rem 1fr;gap:6px;padding:3px 0;border-top:1px solid var(--line)}
.tip .fr b.e{color:var(--blue)}.tip .fr b.t{color:var(--red)}.tip p{margin:6px 0 0;color:var(--mu)}
.tw-ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0 14px}.tw-ctl input{width:5rem}
@media(max-width:820px){.pl{grid-template-columns:3rem 1fr 5.6rem}.pj,.spark{grid-column:1/-1}.fp{grid-column:3;grid-row:1}.sw{grid-template-columns:1fr}.chips{margin-left:0}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
.tr1{display:inline-block;width:64px;height:8px;background:var(--s3);margin-right:7px;vertical-align:middle}.tr1 i{display:block;height:100%;background:var(--blue)}
.gb{display:inline-block;width:56px;height:8px;background:var(--s3);margin-right:7px;vertical-align:middle}.gb i{display:block;height:100%;background:var(--red)}
table.st th{cursor:default}table.st td small{display:block}table.st .chips{display:inline-flex}
.tb{display:inline-block;max-width:100%;line-height:1.3;margin:2px 6px 2px 0;padding:1px 7px;font-size:.74rem;font-weight:700;border:1px solid var(--line);background:var(--s2);color:var(--tx);white-space:normal}
.tb.s3{background:var(--red);border-color:var(--red);color:#fff}.tb.s2{border-color:var(--red);color:var(--red);background:#fff}.tb.fx{outline:2px solid var(--blue)}
.why{margin:2px 0 6px;font-size:.84rem}.fixl{margin-top:4px;color:var(--navy);font-weight:500}
.pgh{margin:18px 0 8px;font-size:1rem}
.pg{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);padding:8px 12px;margin-bottom:8px}
.pg.dn{border-left-color:var(--red)}.pg.sm{border-left-color:#000;font-size:.95rem;max-width:80ch}
.pgt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.pgw{font-size:.88rem;margin-top:2px}
.vd,.av{font-size:.7rem;font-weight:700;padding:1px 7px;border:1px solid var(--line)}
.vd.y{background:var(--blue);border-color:var(--blue);color:#fff}.vd.n{background:var(--s3);color:var(--mu)}.vd.w{color:var(--navy);border-color:var(--navy)}
.av.f{background:#dbe8ff;color:var(--navy);border-color:#9ebcf2}.av.t{background:#fde0e4;color:var(--red);border-color:#f0a3ae}.av.m{background:#000;color:#fff;border-color:#000}.av.u{color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.two{grid-template-columns:1fr}}
.scl{border-left:3px solid var(--blue);padding:4px 10px;background:#f4f8ff;color:var(--tx)}.lsum{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}.lbox{border:1px solid var(--line);border-top:3px solid var(--blue);padding:6px 14px;background:#fff}.lbox small{display:block;color:var(--mu);font-size:.72rem}.lbox b{font-size:1.15rem}.lbox b.up{color:var(--blue)}
.lchg{margin:0 0 10px}.dfc{display:block;white-space:nowrap;font-size:.76rem;padding:1px 6px;margin-bottom:2px;border-left:3px solid var(--line)}.dfc.key{font-weight:700}.dfc.dh{border-left-color:var(--blue);background:#e4eeff}.dfc.dl{border-left-color:var(--red);background:#fde0e4}.dfc small{display:inline;margin-left:6px;color:var(--mu)}
table.st td.why{white-space:normal!important;word-break:normal;font-size:.78rem;min-width:220px;max-width:30ch;line-height:1.35}td b.up{color:var(--blue)}td b.dn{color:var(--red)}

@media(max-width:700px){
body{font-size:14.5px}
header{padding:12px 14px 10px}h1{font-size:1.3rem}.meta{font-size:.72rem;margin-top:3px}
.top{gap:8px}.pick{width:100%}.pick select{width:100%}
.banner{padding:8px 14px;font-size:.8rem}
main{padding:0 14px 40px}
.tabs{position:sticky;top:0;z-index:30;background:#fff;margin:0 -14px 12px;padding:0 4px;scrollbar-width:none;scroll-snap-type:x proximity}.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 11px;font-size:.86rem;scroll-snap-align:center}
select,input[type=search],input[type=number],input[type=password],textarea{font-size:16px}
h3{font-size:1.05rem;margin-top:4px}
details.how{padding:8px 11px;margin:0 0 10px;font-size:.82rem}details.how>.hint{margin:6px 0 0;max-width:none}
.live{font-size:.76rem}
.seg{flex-wrap:wrap}.filters{gap:8px}
.mx th,.mx td{padding:2px 4px;font-size:.7rem;white-space:normal}.mx td small{display:block;margin-left:0}.mx{table-layout:fixed}
.lsum{gap:6px}.lbox{padding:5px 10px;flex:1 1 30%}.lbox b{font-size:1rem}
.tw:has(table.cards){border:0;background:none;overflow:visible}
table.cards{min-width:0;width:100%}table.cards thead{display:none}
table.cards,table.cards tbody,table.cards tr{display:block;width:100%}
table.cards tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:8px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);margin:0 0 10px;padding:8px 10px}
table.cards td{display:block;width:100%;padding:4px 0;border:0;text-align:left!important;white-space:normal;background:none!important;box-shadow:none}
table.cards td::before{content:attr(data-label);display:block;color:var(--mu);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
table.cards td[data-label=""]::before{display:none}
table.cards td.ttl{font-size:1rem;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}table.cards td.ttl::before{display:none}
table.cards td{width:auto!important;max-width:none!important}table.cards td .tb{max-width:100%}table.cards td:not(.sh){grid-column:1/-1}table.cards td.sh{width:auto}table.cards td.ttl{order:-1}
table.cards td.why{max-width:none;min-width:0;font-size:.8rem}
table.cards td small{display:inline;margin-left:6px}
table.cards .tr1{width:44px}
table.dense th:first-child,table.dense td:first-child{position:sticky;left:0;z-index:2;background:#fff}table.dense th:first-child{background:#000}
.tip{font-size:.78rem}
}
</style>

<body>
<header><div class="wrap top">
  <div><h1>NFL Fantasy assistant</h1><p class="meta" id="meta">Kraunama…</p></div>
  <label class="pick">Lyga<select id="league" aria-label="Pasirink lygą"></select></label>
</div></header>
<div class="banner" id="banner" hidden>Rodomi pavyzdiniai duomenys: tai šablono peržiūra, skaičiai netikri.</div>
<main><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div><div id="view"></div></div></main>
<script>
const MAXP=30;
const TABS=[["roster","Sudėtis"],["lineup","Siūloma sudėtis"],["waiver","Waiver"],["trade","Trade"],["stats","Žaidėjų statistika"],["teams","NFL komandos"]];
const ACT={hold:"HOLD",sell:"SELL",trade:"SVARSTYTI TRADE",add:"PRIDĖTI",buy:"PIRKTI"};
const HOW=`<p><b>Projekcija artimiausiai savaitei</b> = ½ × <b>Modelis</b> + ½ × <b>Sleeper projekcija</b> (jei vieno šaltinio nėra, naudojamas kitas). <b>3 sav.</b> = trijų artimiausių savaičių suma (toliau už pirmą savaitę naudojamas tik modelis).</p><p><b>Taškų sistema.</b> Duomenys skaičiuojami pagal standartinį PPR, o puslapis kiekvienai lygai juos perskaičiuoja pagal jos Sleeper nustatymus (priėmimas, QB TD, INT, jardai, TE/RB/WR premijos). Skirtumas skaičiuojamas pagal žaidėjo sezono vidurkį per rungtynes, todėl tai apytikslis pataisymas. Jardų bonusai (100/200/300 yd) ir pirmų downų taškai neįvertinami.</p>
<p><b>Modelis</b> = <code>Bazė × Matchup × Sveikata</code></p>
<p><b>Bazė:</b> paskutinių 5 žaistų savaičių PPR vidurkis, naujesnės savaitės sveria daugiau (1; 0,7; 0,49; 0,34; 0,24). Jei žaista mažai, vidurkis traukiamas link pozicijos vidurkio, pakoreguoto komandos puolimu: gerą run puolimą turinčios komandos RB (ir gerą pass puolimą turinčios komandos QB/WR/TE) laikomi aukščiau.</p>
<p><b>Komandų jardų projekcija:</b> komandos rush/pass jardai = jos vidurkis × varžovo leidžiami jardai ÷ lygos vidurkis, pakoreguota žaidimo scenarijumi (spread: favoritai daugiau bėga, atsilikėliai daugiau meta) ir numatomais taškais (total). Tai ne lažybų kompanijų jardų prognozė (tokios nemokamai nėra), o jų linijomis paremtas mūsų modelis.</p>
<p><b>Matchup:</b> pusė iš „varžovo leidžiami PPR taškai šiai pozicijai“, pusė iš komandos jardų projekcijos (RB: rush, WR/TE: pass, QB: daugiausia pass). Ribos 0,88–1,12.</p>
<p><b>Sveikata:</b> IR/Sus/PUP = 0; Out: 0 / 0,4 / 0,8 per 3 savaites; Doubtful 0,4 / 0,8 / 1; Questionable 0,92; bye savaitė = 0.</p>
<p><b>Kalendoriaus kvadratėliai:</b> kitų 4 savaičių varžovai pagal Matchup koeficientą. Mėlyna = lengvas (&gt; 1,04), raudona = sunkus (&lt; 0,96), pilka = vidutinis, punktyrinė = bye.</p>
<p><b>Žymos:</b> skaičiuojamos pagal 3 savaičių sumą ir tavo starterių sudėtį. PRIDĖTI: laisvas žaidėjas pagerina tavo sudėtį bent 1 tšk. per 3 sav. SELL: paskutinių 3 sav. vidurkis &gt; 1,25 × sezono, o kalendorius sunkus arba vertė aukšta. SVARSTYTI TRADE: silpniausias starteris su sunkiu kalendoriumi, arba suolo žaidėjas su aukšta verte (mainų valiuta). Kitu atveju HOLD. Tai taisyklės, o ne garantija.</p>
<p><b>Komandų langas:</b> NFL komandų skiltyje gali rinktis paskutines 3 / 5 / 10 rungtynių ar savo skaičių; vidurkiai, reitingai ir jardų projekcija perskaičiuojami tame lange.</p>
<p><b>Trade paieška:</b> sudaromi paketai (1–3 žaidėjai) iš tavo sudėties, vertės skirtumas ne didesnis kaip ±20 % (trade calculator vertės), o gerėjimas skaičiuojamas pagal pilną starterių sudėtį (įskaitant FLEX) 3 savaičių suma abiem pusėms.</p>`;
let D,L,mine=new Set(),view="roster",F={pos:"",own:"",q:"",sort:"proj",dir:-1},liveTaken=null,liveAt=null,TR={partner:-1,get:[],give:[]},owners={},autoCache={};
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const f1=v=>v==null?"–":Number(v).toFixed(1),i0=v=>v==null?"–":Math.round(v),p0=v=>v==null?"–":Math.round(v)+" %";
const fd=v=>v==null?"–":(v>0?"+":"")+Number(v).toFixed(1);
const div=(a,b)=>b?a/b:null,pct=(a,b)=>b?a/b*100:null;
const nm=id=>D.stats[id]?D.stats[id].name:(!id||id==="0"?"tuščias slotas":id);

//LOGIC-START
const ELIG={QB:["QB","SUPER_FLEX"],RB:["RB","FLEX","WRRB_FLEX","SUPER_FLEX"],WR:["WR","FLEX","WRRB_FLEX","REC_FLEX","SUPER_FLEX"],TE:["TE","FLEX","REC_FLEX","SUPER_FLEX"],K:["K"],DEF:["DEF"]};
const SLOTW={FLEX:3,WRRB_FLEX:2,REC_FLEX:2,SUPER_FLEX:4};
const OUTS=["Out","IR","Sus","PUP","NA"];
function lineupSet(ids,key){

  for(const s of sl){const p=pool.find(i=>!used.has(i)&&(ELIG[D.stats[i].pos]||[]).includes(s));if(p){used.add(p);pick.push(p)}}
  return pick}

function vHi(){const a=L.teams.flatMap(t=>t.players).map(vl).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length*.6)]:0}
function waiversFor(taken){

  const own=taken?new Set(Object.keys(taken)):new Set(L.teams.flatMap(t=>t.players)),out=[];
  for(const id of Object.keys(D.stats)){
    if(own.has(id))continue;const s=D.stats[id];if(OUTS.includes(s.status)||s.p3<=0)continue;

  return out.sort((x,y)=>y.gain-x.gain).slice(0,8)}
function adviceFor(id){
  const s=D.stats[id],mi=myIds(),isStart=L.roster.some(r=>r.id===id);
  if(OUTS.includes(s.status))return{action:"hold",insight:"Sužeistas ("+s.status+"): "+(isStart?"reikia pakaitalo, ":"")+"sekti naujienas."};
  const hot=s.gp>=4&&s.avg>0&&s.l3>1.25*s.avg,sx=s.sosx||1,hi=vl(id)>=vHi(),hard=sx<0.97,easy=sx>=1.03,sw=hard?"sunkus":(easy?"lengvas":"vidutinis");
  if(!isStart){

    return{action:"hold",insight:"Atsarginis variantas, kalendorius "+sw+"."}}
  if(hot&&(hard||hi))return{action:"sell",insight:"Karštas ruožas (L3 "+f1(s.l3)+" vs sezono "+f1(s.avg)+"), kalendorius "+sw+(hard?"":", vertė aukšta")+": verta pasiūlyti trade, kol forma gera."};
  const all=lineup(mi,"p3"),contrib=i=>all-lineup(mi.filter(x=>x!==i),"p3"),mn=Math.min(...L.roster.map(r=>r.id).filter(i=>D.stats[i]).map(contrib));
  if(contrib(id)<=mn*1.15+0.01&&hard)return{action:"trade",insight:"Silpniausias starteris ("+f1(s.p3)+" per 3 sav.), kalendorius sunkus: svarstyti mainus arba waiver pakaitalą."};
  return{action:"hold",insight:easy?"Kalendorius lengvas, laikyti.":"Prognozė "+f1(s.p3)+" per 3 sav., kalendorius "+sw+". Laikyti."}}
function situation(t){
  const inj=t.starters.filter(i=>D.stats[i]&&OUTS.includes(D.stats[i].status)).map(nm),by=t.starters.filter(i=>D.stats[i]&&D.stats[i].opp==="BYE").map(nm);
  return (inj.length?"Starteriai Out: "+inj.join(", ")+". ":"")+(by.length?"Bye šią savaitę: "+by.join(", ")+". ":"")||"Akivaizdžių sužeidimų ar bye bėdų nėra."}
function troubles(t){
  const out=[],seen=new Set(),thr={QB:14,RB:7,WR:7,TE:6};
  t.starters.filter(i=>D.stats[i]).forEach(i=>{const s=D.stats[i];
    if(OUTS.includes(s.status)){seen.add(i);out.push({k:"inj",pos:s.pos,sev:3,txt:s.pos+": "+s.name+" ("+s.status+")"})}
    else if(s.status==="Doubtful"){seen.add(i);out.push({k:"inj",pos:s.pos,sev:2,txt:s.pos+": "+s.name+" (Doubtful)"})}
    else if(s.opp==="BYE"){seen.add(i);out.push({k:"bye",pos:s.pos,sev:2,txt:s.pos+": "+s.name+" bye"})}});
  lineupSet(t.players,"p3").forEach(i=>{const s=D.stats[i],per=s.p3/3;if(seen.has(i)||!thr[s.pos]||per>=thr[s.pos])return;
    out.push({k:"weak",pos:s.pos,sev:1,per,txt:s.pos+": silpnas starteris "+s.name+" ("+f1(per)+"/sav.)"})});
  return out.sort((a,b)=>b.sev-a.sev)}
function combos(pool,max,forced){
  const rest=pool.filter(i=>!forced.includes(i)),out=[];
  const rec=(st,cur)=>{const n=cur.length+forced.length;if(n>=1&&n<=max)out.push([...forced,...cur]);if(n>=max)return;for(let k=st;k<rest.length;k++){cur.push(rest[k]);rec(k+1,cur);cur.pop()}};
  rec(0,[]);return out}
// o: {partners:[idx], get:[ids], give:[ids]}; mode: auto | give | get
function findTrades(o){
  const me=myTeam(),ids=me.players,base=lineup(ids,"p3"),tol=0.2;
  const mode=o.get.length?"get":(o.give.length?"give":"auto");
  const pool=[...new Set([...o.give,...ids.filter(i=>D.stats[i]).sort((a,b)=>vl(b)-vl(a)).slice(0,14)])];
  const maxG=mode==="get"?Math.min(3,o.get.length+1):(mode==="give"?Math.max(2,o.give.length):2);
  const need={auto:[1,1],give:[0.5,0.5],get:[-1e9,0]}[mode];
  const cands=[];
  L.teams.forEach((t,pi)=>{
    if(t.mine||(o.partners.length&&!o.partners.includes(pi)))return;
    const tb=lineup(t.players,"p3"),TB=troubles(t);
    const targets=mode==="get"?[o.get]:t.players.filter(p=>D.stats[p]&&!OUTS.includes(D.stats[p].status)&&(!o.pos||D.stats[p].pos===o.pos)).sort((a,b)=>D.stats[b].p3-D.stats[a].p3).slice(0,12).map(p=>[p]);
    for(const T of targets){
      if(T.some(p=>!t.players.includes(p)))continue;
      const rv=T.reduce((a,p)=>a+vl(p),0);if(!rv)continue;
      for(const G of combos(pool,maxG,o.give)){
        if(G.some(g=>T.includes(g)))continue;
        const gv=G.reduce((a,p)=>a+vl(p),0);if(!gv)continue;
        const bal=(rv-gv)/Math.max(gv,rv);if(Math.abs(bal)>tol)continue;
        const gme=lineup(ids.filter(x=>!G.includes(x)).concat(T),"p3")-base;
        const tg=lineup(t.players.filter(x=>!T.includes(x)).concat(G),"p3")-tb;
        if(gme<need[0]||tg<need[1])continue;
        const fix=TB.filter(x=>G.some(g=>D.stats[g].pos===x.pos&&!OUTS.includes(D.stats[g].status)&&(x.k!=="weak"||D.stats[g].p3/3>x.per+1)));
        if(o.fixOnly&&mode==="auto"&&!fix.length)continue;
        cands.push({partner:t.name,pi,give:G,get:T,gv,rv,bal,gme,tg,fix,score:gme+.6*tg-15*Math.abs(bal)+1.5*fix.reduce((a,x)=>a+x.sev,0)})}}});
  cands.sort((a,b)=>b.score-a.score);
  const out=[],cp={},ct={},lim=mode==="get"?8:6;
  for(const c of cands){
    const tk=c.get.join(",");
    if(mode!=="get"&&((cp[c.partner]||0)>=2||(ct[tk]||0)>=1))continue;
    out.push(c);cp[c.partner]=(cp[c.partner]||0)+1;ct[tk]=(ct[tk]||0)+1;if(out.length>=lim)break}
  return {mode,res:out}}

/* ===== Lygos taškų sistema: perskaičiuoja visus žaidėjų taškus pagal pasirinktos lygos Sleeper nustatymus ===== */
const SFIELD={pass_yd:"pyd",pass_td:"ptd",pass_int:"int",rush_yd:"ryd",rush_td:"rtd",rec:"rec",rec_yd:"recyd",rec_td:"rectd",pass_cmp:"cmp",pass_att:"patt"};
function adjG(s,sc){
  if(!s.gp)return 0;let t=0;
  for(const [k,v] of Object.entries(sc.d||{}))t+=v*(k==="pass_inc"?((s.patt||0)-(s.cmp||0)):(s[SFIELD[k]]||0));
  t+=((sc.recpos||{})[s.pos]||0)*(s.rec||0);return t/s.gp}
function applyScoring(){
  if(!D._orig)D._orig=JSON.parse(JSON.stringify(D.stats));
  D.stats=JSON.parse(JSON.stringify(D._orig));
  const sc=L.score;if(!sc||(!Object.keys(sc.d||{}).length&&!Object.keys(sc.recpos||{}).length))return;
  const r1=x=>Math.round(x*10)/10;
  Object.values(D.stats).forEach(s=>{const a=adjG(s,sc);if(!a)return;
    s.avg=r1(s.avg+a);s.l3=r1(s.l3+a);s.total=r1(s.total+a*s.gp);if(s.last)s.last=r1(s.last+a);
    s.weeks=(s.weeks||[]).map(w=>w?r1(w+a):w);
    (s.fut||[]).forEach(x=>{if(x.p>0)x.p=Math.max(0,r1(x.p+a))});
    if(s.model>0)s.model=Math.max(0,r1(s.model+a));if(s.sl>0)s.sl=Math.max(0,r1(s.sl+a));
    s.proj=s.fut&&s.fut[0]?s.fut[0].p:s.proj;s.p3=r1((s.fut||[]).reduce((q,x)=>q+x.p,0))})}
